  <!-- Signup Section -->

  <section class="container my-5">
    <h1 class="pb-3 text-center">Signup</h1>
    <form class="card p-3 w-75 mx-auto" onsubmit="return confirm('Successfully sign up')">
      <div class="row mb-3">
        <div class="col">
          <input type="text" class="form-control" placeholder="First name" aria-label="First name">
        </div>
        <div class="col">

      </div>

        <input type="number" class="form-control" placeholder="Phone number" aria-label="Phone number">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Your email" aria-label="Your email">
      </div>
      <div class="mb-3">
        <input required type="text" class="form-control" placeholder="user name" aria-label="username">
      </div>
      <div class="mb-3">
        <input required type="password" class="form-control" placeholder="Password" aria-label="Password">
      </div>
      
      <button class="btn btn-success" type="submit">submit</button>
    </form>
  </section>
